name: source-snapshot

on:
  push:
    branches:
      - chore/source-snapshot-20260823
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create source archive
        shell: bash
        run: tar --exclude=.git -czf pmgs-reference-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: pmgs-reference-source
          path: pmgs-reference-source.tgz
          if-no-files-found: error
          retention-days: 1
