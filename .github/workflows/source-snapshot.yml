name: source-snapshot

on:
  push:
    branches:
      - chore/export-source-artifact
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Prepare offline verification dependencies
        run: |
          uv sync --frozen --all-groups
          mkdir -p .offline-site-packages .offline-bin
          cp -a .venv/lib/python3.13/site-packages/. .offline-site-packages/
          cp .venv/bin/ruff .offline-bin/ruff
          chmod +x .offline-bin/ruff
          npm --prefix worker ci

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pmgs-reference-source
          path: |
            .
            !.venv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
