name: apply-release-v050

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/release-v050-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: a4efcae7a39e66984a436a5106b9de53e28e6608
      EXPECTED_RELEASE_HEAD: a4efcae7a39e66984a436a5106b9de53e28e6608
      PATCH_SHA256: 4e7fe9c741399d8c93dd675a22fb624fa03154b914f4ba5dff73fd554d6ef98c
    steps:
      - name: Check out helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false
      - name: Decode and verify release patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v050-release-patch/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/v050-release.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v050-release.patch" | sha256sum -c -
      - name: Apply patch to fixed main
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          actual_release="$(git ls-remote origin refs/heads/release/v0.5.0 | awk '{print $1}')"
          test "$actual_main" = "$EXPECTED_MAIN"
          test "$actual_release" = "$EXPECTED_RELEASE_HEAD"
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release/v0.5.0:refs/remotes/origin/release/v0.5.0
          git checkout -B release-v050 origin/main
          git apply --check "$RUNNER_TEMP/v050-release.patch"
          git apply "$RUNNER_TEMP/v050-release.patch"
          python - <<'PY'
          from pathlib import Path

          plan = Path("PLAN.md")
          text = plan.read_text(encoding="utf-8")
          old = (
              "GitHub source repository、PyPI v0.4.0、GitHub Release v0.4.0を現在の配布面とする。"
              "Web deploy、domain公開、R2 upload、外部検索エンジンへの登録は停止中の別外部状態であり、"
              "第三者向けセルフホスト手順だけを提供する。"
          )
          new = (
              "GitHub source repository、PyPI v0.5.0、GitHub Release v0.5.0を現在の配布面とする。"
              "Web deploy、domain公開、R2 upload、外部検索エンジンへの登録は停止中の別外部状態であり、"
              "第三者向けセルフホスト手順だけを提供する。"
          )
          if old not in text:
              raise SystemExit("PLAN.md release-surface anchor not found")
          plan.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          notes = Path("docs/releases/v0.5.0.md")
          notes.parent.mkdir(parents=True, exist_ok=True)
          notes.write_text(
              """# PMGS Reference v0.5.0\n\n"
              "公開日: 2026-08-24\n\n"
              "## 概要\n\n"
              "v0.5.0は、v0.4.0以降にmainへ統合した検索、診断、検証、安全性、文書取得の改善を一般利用者へ届けるリリースです。\n\n"
              "## 主な改善\n\n"
              "- 分類・文書検索で重複をまとめてから件数制限し、独立したoffsetとnext_offsetで欠落なく続行できるようにしました。\n"
              "- 分類階層の取得をページングし、lookupのN+1照会を除去しました。\n"
              "- doctorへタイムアウト、子プロセス回収、3つのMCP toolの実呼出し、SQLite不変性確認を追加しました。\n"
              "- CLIのJSON失敗応答を安定したschemaとerror codeへ統一しました。\n"
              "- FTS5の索引整合性、virtual table module、列順、UNINDEXED、tokenizerをfail closedで検証します。\n"
              "- Codex・Claude Codeの実行ファイル探索から相対PATHと作業ディレクトリ経由の解決を除外しました。\n"
              "- release workflowを3 OS、installed wheel、sdist由来wheel、Worker、決定性比較でゲートします。\n"
              "- 文書取得のsectionを正のsegment sequence番号へ統一し、locatorを分離しました。\n"
              "- 200件を超える文書segmentと関連分類を独立してページングできるようにしました。\n\n"
              "## 互換性上の注意\n\n"
              "Python APIやMCPで文字列をsectionへ渡していた呼出しは、その値をlocatorへ移してください。sectionは1始まりの整数sequence番号です。\n\n"
              "## インストール\n\n"
              "```powershell\n"
              "uv tool install --force --reinstall \"pmgs-reference==0.5.0\"\n"
              "pmgs --version\n"
              "```\n\n"
              "## 既知の未観測項目\n\n"
              "- Claude Codeの設定と登録は自動検証済みですが、実モデルによるlive MCP評価はnot_observedです。\n"
              "- 旧SQLite向けFTS5 fallbackは合成fixtureで検証済みですが、全量JPPMでの時間と一時disk使用量は別Issueで追跡します。\n"
              """,
              encoding="utf-8",
              newline="\n",
          )
          PY
          actual_files="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected_files=$'PLAN.md\nREADME.en.md\nREADME.md\ndocs/current-status.md\ndocs/local-agent-kit.en.md\ndocs/local-agent-kit.md\ndocs/release-runbook.md\ndocs/releases/v0.5.0.md\ndocs/requirements-traceability.md\npyproject.toml\ntests/test_project_contracts.py\nuv.lock'
          printf '%s\n' '=== actual release files ===' "$actual_files"
          printf '%s\n' '=== expected release files ===' "$expected_files"
          unexpected="$(comm -23 <(printf '%s\n' "$actual_files") <(printf '%s\n' "$expected_files"))"
          missing="$(comm -13 <(printf '%s\n' "$actual_files") <(printf '%s\n' "$expected_files"))"
          test -z "$unexpected"
          test -z "$missing"
      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-groups
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_release_tag.py --tag v0.5.0
          uv run --frozen python scripts/verify_wheel_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Replace release branch with verified commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v0.5.0 release"
          git push \
            --force-with-lease=refs/heads/release/v0.5.0:$EXPECTED_RELEASE_HEAD \
            origin HEAD:refs/heads/release/v0.5.0
