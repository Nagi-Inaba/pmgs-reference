name: apply-release-v050

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chore/release-v050-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: a4efcae7a39e66984a436a5106b9de53e28e6608
      EXPECTED_RELEASE_HEAD: a4efcae7a39e66984a436a5106b9de53e28e6608
      PATCH_SHA256: 4e7fe9c741399d8c93dd675a22fb624fa03154b914f4ba5dff73fd554d6ef98c
    steps:
      - name: Check out helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false
      - name: Decode and verify release patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v050-release-patch/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/v050-release.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/v050-release.patch" | sha256sum -c -
      - name: Apply patch to fixed main
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          actual_release="$(git ls-remote origin refs/heads/release/v0.5.0 | awk '{print $1}')"
          test "$actual_main" = "$EXPECTED_MAIN"
          test "$actual_release" = "$EXPECTED_RELEASE_HEAD"
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release/v0.5.0:refs/remotes/origin/release/v0.5.0
          git checkout -B release-v050 origin/main
          git apply --check "$RUNNER_TEMP/v050-release.patch"
          git apply "$RUNNER_TEMP/v050-release.patch"
          actual_files="$(git diff --name-only | sort)"
          expected_files=$'README.en.md\nREADME.md\ndocs/current-status.md\ndocs/local-agent-kit.en.md\ndocs/local-agent-kit.md\ndocs/release-runbook.md\ndocs/releases/v0.5.0.md\ndocs/requirements-traceability.md\npyproject.toml\ntests/test_project_contracts.py\nuv.lock'
          test "$actual_files" = "$expected_files"
      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-groups
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_release_tag.py --tag v0.5.0
          uv run --frozen python scripts/verify_wheel_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Replace release branch with verified commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v0.5.0 release"
          git push \
            --force-with-lease=refs/heads/release/v0.5.0:$EXPECTED_RELEASE_HEAD \
            origin HEAD:refs/heads/release/v0.5.0
