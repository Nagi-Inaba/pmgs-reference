name: pr54-apply

on:
  push:
    branches:
      - fix/fts5-index-integrity-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/fts5-index-integrity-v2
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Apply reviewed implementation
        run: python scripts/apply_pr54_fix.py

      - name: Verify implementation
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format src/pmgs_reference/validation.py tests/test_fts_integrity_contract.py scripts/apply_pr54_fix.py
          uv run --frozen ruff check src/pmgs_reference/validation.py tests/test_fts_integrity_contract.py
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build

      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/workflows/pr54-apply.yml .github/workflows/pr54-autofix.yml scripts/apply_pr54_fix.py
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add src/pmgs_reference/validation.py tests/test_fts_integrity_contract.py docs/verification/fts-integrity-2026-08-22.md
          git commit -m "fix: validate FTS5 indexes across SQLite versions"
          git push origin HEAD:fix/fts5-index-integrity-v2
