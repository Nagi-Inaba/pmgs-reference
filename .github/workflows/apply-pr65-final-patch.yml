name: apply-pr65-final-patch

on:
  push:
    branches:
      - chore/export-pr65-bundle-20260823

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Decode and verify the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr65-final-patch/part-*.txt \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/pr65-final.patch"
          echo "16de6aff5c4deee8627452e4ed42456b2dbd305af066aa7d0a1075b463bff7cd  $RUNNER_TEMP/pr65-final.patch" \
            | sha256sum -c -
      - name: Apply only the product patch to the fixed base
        shell: bash
        env:
          EXPECTED_MAIN: 9182a496c9e61d34df9a7f4f77d27156bbbfe4a9
          EXPECTED_OLD_HEAD: 16e43f243cf8aaceb87fad6b0241081af0b19a26
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          actual_old_head="$(git ls-remote origin refs/heads/fix/document-selector-pagination | awk '{print $1}')"
          test "$actual_main" = "$EXPECTED_MAIN"
          test "$actual_old_head" = "$EXPECTED_OLD_HEAD"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout -B pr65-final origin/main
          git apply --index "$RUNNER_TEMP/pr65-final.patch"
          expected="$(printf '%s\n' \
            docs/local-interfaces.en.md \
            docs/local-interfaces.md \
            src/pmgs_reference/cli.py \
            src/pmgs_reference/mcp_server.py \
            src/pmgs_reference/resources/skills/pmgs-reference/SKILL.md \
            src/pmgs_reference/store.py \
            tests/test_document_pagination.py \
            tests/test_document_pagination_boundaries.py \
            worker/src/api.ts | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Run the full verification gates
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_wheel_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Replace PR 65 with the verified clean commit
        shell: bash
        env:
          EXPECTED_OLD_HEAD: 16e43f243cf8aaceb87fad6b0241081af0b19a26
        run: |
          set -euo pipefail
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git commit -m "feat: unify and paginate document retrieval"
          git push \
            --force-with-lease=refs/heads/fix/document-selector-pagination:${EXPECTED_OLD_HEAD} \
            origin HEAD:fix/document-selector-pagination
