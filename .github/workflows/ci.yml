name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify tracked data boundary
        run: uv run --frozen python scripts/verify_repository_boundary.py

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Type-check
        run: uv run --frozen mypy src

      - name: Test synthetic fixtures
        run: uv run --frozen pytest -q

      - name: Build distributions
        run: uv build

  wheel-e2e:
    name: Installed wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Build wheel
        run: uv build --wheel

      - name: Verify installed setup and doctor
        run: >-
          uv run --frozen python scripts/verify_wheel_install.py
          --dist-dir dist
          --source tests/fixtures/synthetic_pmgs

  synthetic-determinism:
    name: Synthetic determinism on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Build determinism report
        run: >-
          uv run --frozen python scripts/verify_synthetic_determinism.py
          --source tests/fixtures/synthetic_pmgs
          --policy tests/fixtures/publication-policy.yaml
          --output determinism-${{ runner.os }}.json

      - name: Upload determinism report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: determinism-${{ runner.os }}
          path: determinism-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 7

  compare-synthetic-determinism:
    name: Compare synthetic determinism
    needs: synthetic-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"

      - name: Download determinism reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: determinism-*
          path: determinism-reports
          merge-multiple: true

      - name: Compare stable contracts
        run: >-
          uv run --python 3.12 --no-project python scripts/compare_determinism_reports.py
          --directory determinism-reports

  worker:
    name: Cloudflare Worker on Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: worker

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Worker, WebMCP, bundle, and dependencies
        run: npm run verify
