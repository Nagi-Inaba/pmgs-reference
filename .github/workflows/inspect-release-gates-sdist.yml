name: inspect-release-gates-sdist

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/release-gates-sdist
          persist-credentials: false
      - name: Reconstruct reviewed source archive
        shell: bash
        run: |
          cat .github/step1-chunks/part-*.txt | base64 --decode > "$RUNNER_TEMP/step1-changes.tar.gz"
          tar -tzf "$RUNNER_TEMP/step1-changes.tar.gz" >/dev/null
          mkdir "$RUNNER_TEMP/reconstructed"
          tar -xzf "$RUNNER_TEMP/step1-changes.tar.gz" -C "$RUNNER_TEMP/reconstructed"
      - name: Upload reconstructed source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reconstructed-release-gates-sdist
          path: ${{ runner.temp }}/reconstructed
          if-no-files-found: error
          retention-days: 1
