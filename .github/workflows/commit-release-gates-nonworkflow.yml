name: commit-release-gates-nonworkflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/release-gates-sdist
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct and normalize reviewed implementation
        shell: bash
        run: |
          cat .github/step1-chunks/part-*.txt | base64 --decode > "$RUNNER_TEMP/step1-changes.tar.gz"
          tar -tzf "$RUNNER_TEMP/step1-changes.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/step1-changes.tar.gz" -C .
          python scripts/materialize_release_gates_sdist.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_release_gate_contract.py")
          text = path.read_text(encoding="utf-8")
          path.write_text(text.replace('"build-distributions"', '"build"'), encoding="utf-8")
          PY
      - name: Verify complete implementation
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format scripts/materialize_release_gates_sdist.py scripts/verify_distribution_set.py tests/test_release_scripts.py tests/test_release_gate_contract.py tests/test_project_contracts.py
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_wheel_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Commit verified non-workflow files
        shell: bash
        run: |
          git rm -r .github/step1-chunks
          git rm -f scripts/materialize_release_gates_sdist.py
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add \
            docs/release-runbook.md \
            docs/requirements-traceability.md \
            docs/verification/2026-08-23-release-gates-sdist.md \
            scripts/verify_distribution_set.py \
            scripts/verify_sdist_install.py \
            tests/test_project_contracts.py \
            tests/test_release_gate_contract.py \
            tests/test_release_scripts.py
          git commit -m "ci: verify release artifacts across three operating systems"
          git push origin HEAD:ci/release-gates-sdist
