name: pr53-migration-docs

on:
  push:
    branches:
      - perf/paginated-hierarchy-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/paginated-hierarchy-clean
          fetch-depth: 0

      - name: Add explicit hierarchy migration guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/local-interfaces.en.md"): (
                  "If multiple revisions are active at the release reference date, hierarchy retrieval fails closed with `MULTIPLE_ACTIVE_REVISIONS` instead of selecting one by order.",
                  "If multiple revisions are active at the release reference date, hierarchy retrieval fails closed with `MULTIPLE_ACTIVE_REVISIONS` instead of selecting one by order. Call `lookup()` for a selected summary when full texts, properties, relations, documents, and sources are required; callers that previously consumed full records from `parents()` or `children()` must migrate to this two-step pattern.",
              ),
              Path("docs/local-interfaces.md"): (
                  "release基準日に複数revisionが同時にactiveな場合は、並び順で一つを選ばず`MULTIPLE_ACTIVE_REVISIONS`でfail closedにする。",
                  "release基準日に複数revisionが同時にactiveな場合は、並び順で一つを選ばず`MULTIPLE_ACTIVE_REVISIONS`でfail closedにする。完全なtexts、properties、relations、documents、sourcesが必要な場合は、選択したsummaryを`lookup()`へ渡す。従来`parents()`または`children()`から完全recordを受け取っていた呼び出し側は、この二段階へ移行する。",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"migration paragraph anchor mismatch: {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit guidance and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pr53-migration-docs.yml
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add docs/local-interfaces.en.md docs/local-interfaces.md
          git commit -m "docs: add hierarchy migration guidance"
          git push origin HEAD:perf/paginated-hierarchy-clean
