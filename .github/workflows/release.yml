name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false

      - name: Sync locked dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-groups

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen python scripts/verify_release_tag.py --tag "$RELEASE_TAG"

      - name: Verify repository boundary
        run: uv run --frozen python scripts/verify_repository_boundary.py

      - name: Verify Python source and tests
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q

      - name: Verify Worker and WebMCP source
        run: |
          npm --prefix worker ci
          npm --prefix worker run verify

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify the installed wheel
        run: >-
          uv run --frozen python scripts/verify_wheel_install.py
          --dist-dir dist
          --source tests/fixtures/synthetic_pmgs

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-pypi:
    name: Publish to PyPI after approval
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pmgs-reference
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Publish with trusted publishing and attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  publish-github:
    name: Create GitHub Release from the published distributions
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download the same verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
