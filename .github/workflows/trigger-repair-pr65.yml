name: trigger-repair-pr65

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'chore/workbench-remaining-issues-20260824'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: 9182a496c9e61d34df9a7f4f77d27156bbbfe4a9
      EXPECTED_PR_HEAD: 16e43f243cf8aaceb87fad6b0241081af0b19a26
    steps:
      - name: Check out helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false
      - name: Load repair scripts
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/repair-pr65-clean.yml').read_text(encoding='utf-8')
          )
          steps = {
              step.get('name'): step.get('run')
              for step in workflow['jobs']['repair']['steps']
              if isinstance(step, dict)
          }
          for name, destination in (
              ('Reconstruct product-only change on current main', '/tmp/pr65-reconstruct.sh'),
              ('Verify complete feature', '/tmp/pr65-verify.sh'),
              ('Replace PR branch with one verified commit', '/tmp/pr65-push.sh'),
          ):
              script = steps.get(name)
              if not isinstance(script, str) or not script.strip():
                  raise SystemExit(f'missing repair step: {name}')
              Path(destination).write_text(script, encoding='utf-8', newline='\n')

          path = Path('/tmp/pr65-reconstruct.sh')
          text = path.read_text(encoding='utf-8')
          old = 'raise SystemExit("boundary count anchor missing")'
          if old not in text:
              raise SystemExit('missing brittle boundary guard')
          path.write_text(
              text.replace(
                  old,
                  'print("boundary fixture will be normalized after reconstruction")',
                  1,
              ),
              encoding='utf-8',
              newline='\n',
          )
          PY
      - name: Reconstruct product-only branch
        shell: bash
        run: bash /tmp/pr65-reconstruct.sh
      - name: Normalize boundary fixture structurally
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_document_pagination_boundaries.py')
          text = path.read_text(encoding='utf-8')
          replacement = '''        related_count = int(
              connection.execute(
                  "SELECT "
                  "(SELECT COUNT(*) FROM document_link WHERE document_id = ?) + "
                  "(SELECT COUNT(*) FROM document_revision_link WHERE document_id = ?)",
                  (document_id, document_id),
              ).fetchone()[0]
          )
          '''
          pattern = re.compile(
              r'        related_count = int\(\n.*?        \)\n        if segment_count',
              re.DOTALL,
          )
          updated, count = pattern.subn(replacement + '        if segment_count', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one boundary count block, found {count}')
          path.write_text(updated, encoding='utf-8', newline='\n')
          PY
          uv run --frozen ruff format tests/test_document_pagination_boundaries.py
          git add tests/test_document_pagination_boundaries.py
          git commit -m "test: normalize document pagination boundary fixture"
      - name: Verify complete feature
        shell: bash
        run: bash /tmp/pr65-verify.sh
      - name: Replace PR 65 branch
        shell: bash
        run: bash /tmp/pr65-push.sh
