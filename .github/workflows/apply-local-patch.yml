name: apply-local-patch

on:
  push:
    branches:
      - chore/export-source-artifact
    paths:
      - ".patchparts/**/meta.json"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out relay branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply patch to target branch
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          META=$(git diff --name-only "$BEFORE" "$AFTER" -- '.patchparts/**/meta.json' | tail -n 1)
          test -n "$META"
          DIR=$(dirname "$META")
          TARGET=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target"])' "$META")
          BASE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("base", "main"))' "$META")
          MESSAGE=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["message"])' "$META")
          COMPRESSION=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("compression", "none"))' "$META")
          cat "$DIR"/part-* | base64 --decode > /tmp/change.payload
          if [ "$COMPRESSION" = "gzip" ]; then
            gzip --decompress --stdout /tmp/change.payload > /tmp/change.patch
          else
            cp /tmp/change.payload /tmp/change.patch
          fi
          git fetch origin "$BASE"
          git checkout -B "$TARGET" "origin/$BASE"
          git apply --index --3way /tmp/change.patch
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push origin HEAD:"$TARGET"
