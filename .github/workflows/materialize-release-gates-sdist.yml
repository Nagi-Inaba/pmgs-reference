name: materialize-release-gates-sdist

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/release-gates-sdist
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct and normalize reviewed implementation
        shell: bash
        run: |
          cat .github/step1-chunks/part-*.txt | base64 --decode > "$RUNNER_TEMP/step1-changes.tar.gz"
          tar -tzf "$RUNNER_TEMP/step1-changes.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/step1-changes.tar.gz" -C .
          python scripts/materialize_release_gates_sdist.py
          rm scripts/materialize_release_gates_sdist.py
      - name: Verify complete implementation
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format scripts/verify_distribution_set.py tests/test_release_scripts.py tests/test_release_gate_contract.py tests/test_project_contracts.py
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_wheel_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Collect exact verified files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          cp --parents \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            docs/release-runbook.md \
            docs/requirements-traceability.md \
            docs/verification/2026-08-23-release-gates-sdist.md \
            scripts/verify_distribution_set.py \
            scripts/verify_sdist_install.py \
            tests/test_project_contracts.py \
            tests/test_release_gate_contract.py \
            tests/test_release_scripts.py \
            "$RUNNER_TEMP/verified"
      - name: Upload verified implementation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-gates-sdist
          path: ${{ runner.temp }}/verified
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
