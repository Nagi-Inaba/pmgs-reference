name: pr61-implementation

on:
  push:
    branches:
      - fix/fts5-schema-contract

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/fts5-schema-contract
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Apply or persist diagnostics
        shell: bash
        run: |
          set +e
          {
            python scripts/apply_fts_schema_contract.py
            uv sync --frozen --all-groups
            uv run --frozen ruff format \
              src/pmgs_reference/fts_schema.py \
              src/pmgs_reference/validation.py \
              src/pmgs_reference/store.py \
              tests/test_fts_schema_contract.py
          } > /tmp/pr61-implementation.log 2>&1
          status=$?
          set -e

          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            {
              echo "# PR #61 implementation diagnostic"
              echo
              echo '```text'
              tail -n 200 /tmp/pr61-implementation.log
              echo '```'
            } > docs/verification/pr61-implementation-error.md
            git rm .github/workflows/pr61-implementation.yml
            git add docs/verification/pr61-implementation-error.md
            git commit -m "test: record FTS5 implementation failure"
            git push origin HEAD:fix/fts5-schema-contract
            exit 1
          fi

          git rm .github/workflows/pr61-implementation.yml scripts/apply_fts_schema_contract.py
          git add \
            src/pmgs_reference/fts_schema.py \
            src/pmgs_reference/validation.py \
            src/pmgs_reference/store.py \
            tests/test_fts_schema_contract.py \
            docs/verification/fts5-schema-contract-2026-08-23.md
          git commit -m "fix: enforce canonical FTS5 schema contracts"
          git push origin HEAD:fix/fts5-schema-contract
