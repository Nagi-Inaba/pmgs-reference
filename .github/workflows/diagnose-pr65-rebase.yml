name: diagnose-pr65-rebase

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'chore/diagnose-pr65-rebase'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the PR 65 feature branch with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/document-selector-pagination
          fetch-depth: 0
      - name: Rebase the original feature diff onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --binary \
            1f5c58504c9f4f869e52ed1cb9efe97e25d2f636 \
            004c4b6b94299b5c25b1acac7eaf01687975f1a8 \
            -- \
            docs/local-interfaces.en.md \
            docs/local-interfaces.md \
            src/pmgs_reference/cli.py \
            src/pmgs_reference/mcp_server.py \
            src/pmgs_reference/resources/skills/pmgs-reference/SKILL.md \
            src/pmgs_reference/store.py \
            tests/test_document_pagination.py \
            worker/src/api.ts \
            > "$RUNNER_TEMP/pr65.patch"
          git checkout -B repaired origin/main
          set +e
          git apply --3way --index "$RUNNER_TEMP/pr65.patch"
          apply_status=$?
          set -e
          unresolved="$(git diff --name-only --diff-filter=U)"
          expected=$'docs/local-interfaces.en.md\ndocs/local-interfaces.md'
          if [ "$apply_status" -ne 0 ] && [ "$unresolved" != "$expected" ]; then
            echo "Unexpected conflict set:" >&2
            printf '%s\n' "$unresolved" >&2
            exit 1
          fi
      - name: Resolve documentation conflicts without dropping newer contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("docs/local-interfaces.en.md"): (
                  """<<<<<<< ours
- `get_document(document_id, page=None, section=None)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20, *, offset=0)`
=======
- `get_document(document_id, page=None, section=None, *, locator=None, segment_limit=200, segment_offset=0, related_classification_limit=200, related_classification_offset=0)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20)`
>>>>>>> theirs""",
                  """- `get_document(document_id, page=None, section=None, *, locator=None, segment_limit=200, segment_offset=0, related_classification_limit=200, related_classification_offset=0)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20, *, offset=0)`""",
                  """<<<<<<< ours
pmgs doctor --timeout-seconds 30 --json
=======
pmgs document DOCUMENT_ID --section 201 --segment-limit 50 --segment-offset 0 --json
pmgs document DOCUMENT_ID --locator \"page:1\" --related-classification-limit 50 --json
pmgs doctor --json
>>>>>>> theirs""",
                  """pmgs document DOCUMENT_ID --section 201 --segment-limit 50 --segment-offset 0 --json
pmgs document DOCUMENT_ID --locator \"page:1\" --related-classification-limit 50 --json
pmgs doctor --timeout-seconds 30 --json""",
              ),
              Path("docs/local-interfaces.md"): (
                  """<<<<<<< ours
- `get_document(document_id, page=None, section=None)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20, *, offset=0)`
=======
- `get_document(document_id, page=None, section=None, *, locator=None, segment_limit=200, segment_offset=0, related_classification_limit=200, related_classification_offset=0)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20)`
>>>>>>> theirs""",
                  """- `get_document(document_id, page=None, section=None, *, locator=None, segment_limit=200, segment_offset=0, related_classification_limit=200, related_classification_offset=0)`
- `search_documents(query, release=\"current\", language=\"ja\", limit=20, *, offset=0)`""",
                  """<<<<<<< ours
pmgs doctor --timeout-seconds 30 --json
=======
pmgs document DOCUMENT_ID --section 201 --segment-limit 50 --segment-offset 0 --json
pmgs document DOCUMENT_ID --locator \"page:1\" --related-classification-limit 50 --json
pmgs doctor --json
>>>>>>> theirs""",
                  """pmgs document DOCUMENT_ID --section 201 --segment-limit 50 --segment-offset 0 --json
pmgs document DOCUMENT_ID --locator \"page:1\" --related-classification-limit 50 --json
pmgs doctor --timeout-seconds 30 --json""",
              ),
          }

          for path, values in replacements.items():
              text = path.read_text(encoding="utf-8")
              first_old, first_new, second_old, second_new = values
              for old, new, label in (
                  (first_old, first_new, "method list"),
                  (second_old, second_new, "CLI examples"),
              ):
                  if old not in text:
                      raise SystemExit(f"{path}: missing expected {label} conflict")
                  text = text.replace(old, new, 1)
              if any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>")):
                  raise SystemExit(f"{path}: unresolved conflict marker remains")
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git add docs/local-interfaces.en.md docs/local-interfaces.md
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
      - name: Install locked toolchain
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Verify the complete repaired feature
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format \
            src/pmgs_reference/cli.py \
            src/pmgs_reference/mcp_server.py \
            src/pmgs_reference/store.py \
            tests/test_document_pagination.py
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_wheel_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          UV_OFFLINE=1 uv run --frozen python scripts/verify_sdist_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Replace PR 65 branch with the verified rebased commit
        shell: bash
        run: |
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add \
            docs/local-interfaces.en.md \
            docs/local-interfaces.md \
            src/pmgs_reference/cli.py \
            src/pmgs_reference/mcp_server.py \
            src/pmgs_reference/resources/skills/pmgs-reference/SKILL.md \
            src/pmgs_reference/store.py \
            tests/test_document_pagination.py \
            worker/src/api.ts
          git commit -m "feat: unify and paginate document retrieval"
          git push \
            --force-with-lease=refs/heads/fix/document-selector-pagination:b2c3a0d80cf44a16d1251d0d0844c45c5d0f8f87 \
            origin HEAD:fix/document-selector-pagination
