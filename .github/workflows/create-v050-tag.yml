name: create-v050-tag

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.head_ref == 'chore/fix-v050-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_MAIN: 65a33f5628e380fdbeb78d26570b3b9d5ccfbb35
      RELEASE_TAG: v0.5.0
    steps:
      - name: Check out helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify fixed release source
        shell: bash
        run: |
          set -euo pipefail
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_main" = "$EXPECTED_MAIN"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "tag already exists" >&2
            exit 1
          fi
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git show origin/main:pyproject.toml | sed -n 's/^version = "\([^"]*\)"/\1/p')" = "0.5.0"
          git show origin/main:scripts/verify_release_tag.py > "$RUNNER_TEMP/verify_release_tag.py"
          python "$RUNNER_TEMP/verify_release_tag.py" --tag "$RELEASE_TAG"
      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "$RELEASE_TAG" "$EXPECTED_MAIN"
          git push origin "refs/tags/$RELEASE_TAG"
