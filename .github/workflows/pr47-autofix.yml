name: pr47-autofix

on:
  push:
    branches:
      - perf/paginated-hierarchy-api-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/paginated-hierarchy-api-v2
          fetch-depth: 0

      - name: Apply hierarchy ambiguity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/pmgs_reference/store.py")
          text = path.read_text(encoding="utf-8")
          rows_anchor = '''            rows = connection.execute(
                          target_cte + "SELECT c.scheme, c.edition, c.normalized_code, c.record_status, "
          '''
          if text.count(rows_anchor) != 1:
              raise SystemExit("hierarchy rows anchor not found exactly once")
          guard = '''            reference_date = str(release_row["reference_date"])
                      ambiguous_revision = connection.execute(
                          target_cte
                          + "SELECT c.concept_id FROM target_ids ids "
                          "JOIN concept c ON c.concept_id = ids.concept_id "
                          "JOIN concept_revision cr ON cr.concept_id = c.concept_id "
                          "WHERE c.record_status = 'canonical' "
                          "AND (cr.valid_from IS NULL OR cr.valid_from <= ?) "
                          "AND (cr.valid_to IS NULL OR cr.valid_to >= ?) "
                          "GROUP BY c.concept_id HAVING COUNT(*) > 1 LIMIT 1",
                          (concept_id, reference_date, reference_date),
                      ).fetchone()
                      if ambiguous_revision is not None:
                          raise PMGSQueryError(
                              "MULTIPLE_ACTIVE_REVISIONS",
                              "multiple classification revisions are active at the release reference date",
                          )
          '''
          text = text.replace(rows_anchor, guard + rows_anchor, 1)
          parameter_anchor = '''                    concept_id,
                              valid_language,
                              str(release_row["reference_date"]),
                              str(release_row["reference_date"]),
                              valid_limit,
          '''
          replacement = '''                    concept_id,
                              valid_language,
                              reference_date,
                              reference_date,
                              valid_limit,
          '''
          if text.count(parameter_anchor) != 1:
              raise SystemExit("hierarchy date-parameter anchor not found exactly once")
          path.write_text(text.replace(parameter_anchor, replacement, 1), encoding="utf-8")
          PY

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Verify focused change
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format src/pmgs_reference/store.py tests/test_hierarchy_pagination_contract.py
          uv run --frozen ruff check src/pmgs_reference/store.py tests/test_hierarchy_pagination_contract.py
          uv run --frozen mypy src
          uv run --frozen pytest -q tests/test_hierarchy_pagination_contract.py

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/pr47-autofix.yml
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add src/pmgs_reference/store.py tests/test_hierarchy_pagination_contract.py
          git commit -m "fix: reject ambiguous hierarchy revisions"
          git push origin HEAD:perf/paginated-hierarchy-api-v2
