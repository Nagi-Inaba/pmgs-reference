# Weekly comment-only review of Dependabot pull requests that are semver-major
# or have failing checks. Codex never receives write permission. The comment
# job posts a COMMENT review and does not approve, merge, or close.
# Monday 09:00 Asia/Tokyo (UTC+9, no daylight saving) is 00:00 UTC.
name: Dependabot Codex review

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-codex-review
  cancel-in-progress: false

jobs:
  select:
    name: Select Dependabot pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'Nagi-Inaba/pmgs-reference'
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      count: ${{ steps.candidates.outputs.count }}
      prs: ${{ steps.candidates.outputs.prs }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip when OPENAI_API_KEY is missing
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY is not set. Skipping Codex review."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: List major or failing Dependabot pull requests
        id: candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP: ${{ steps.gate.outputs.skip }}
        run: |
          if [ "${SKIP}" = "true" ]; then
            echo "count=0" >> "${GITHUB_OUTPUT}"
            echo "prs=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          payload="$(python3 .github/scripts/dependabot_codex_review.py select)"
          count="$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1] or "[]")))' "${payload}")"
          {
            echo "count=${count}"
            echo "prs<<EOF"
            printf '%s\n' "${payload}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  codex:
    name: Review Dependabot pull request
    needs: select
    if: needs.select.outputs.skip != 'true' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare untrusted review packet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr.number }}
          PR_REASONS: ${{ join(matrix.pr.reasons, ',') }}
          PACKET_DIR: ${{ runner.temp }}/dependabot-review
        run: |
          python3 .github/scripts/dependabot_codex_review.py packet \
            --number "${PR_NUMBER}" \
            --reasons "${PR_REASONS}" \
            --output-dir "${PACKET_DIR}"

      - name: Run Codex
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/dependabot-review/prompt.md
          working-directory: ${{ runner.temp }}/dependabot-review
          output-file: ${{ runner.temp }}/dependabot-review/final-message.md
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Upload Codex review
        if: steps.codex.outputs.final-message != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-codex-review-${{ matrix.pr.number }}
          path: ${{ runner.temp }}/dependabot-review/final-message.md
          retention-days: 1
          if-no-files-found: error

  comment:
    name: Post Codex review comment
    needs: [select, codex]
    if: >-
      always() &&
      needs.select.outputs.skip != 'true' &&
      needs.select.outputs.count != '0' &&
      contains(fromJSON('["success","failure"]'), needs.codex.result)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Codex review
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-codex-review-${{ matrix.pr.number }}
          path: review

      - name: Post a COMMENT review
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ matrix.pr.number }}
          PR_HEAD: ${{ matrix.pr.head }}
          PR_REASONS: ${{ join(matrix.pr.reasons, ',') }}
        run: |
          python3 .github/scripts/dependabot_codex_review.py comment \
            --number "${PR_NUMBER}" \
            --head "${PR_HEAD}" \
            --reasons "${PR_REASONS}" \
            --body-file review/final-message.md
