name: apply-release-gates-sdist

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/release-gates-sdist
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Reconstruct and apply reviewed source archive
        shell: bash
        run: |
          cat .github/step1-chunks/part-*.txt | base64 --decode > "$RUNNER_TEMP/step1-changes.tar.gz"
          tar -tzf "$RUNNER_TEMP/step1-changes.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/step1-changes.tar.gz" -C .
      - name: Normalize staged sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_release_scripts.py")
          text = test_path.read_text(encoding="utf-8")
          replacements = (
              (
                  '''    metadata = (\n        "Metadata-Version: 2.4\\n"\n        "Name: pmgs-reference\\n"\n        "Version: 0.4.0\\n"\n        "Requires-Python: >=3.12\\n\\n"\n    ).encode()\n''',
                  '''    metadata = (\n        b"Metadata-Version: 2.4\\n"\n        b"Name: pmgs-reference\\n"\n        b"Version: 0.4.0\\n"\n        b"Requires-Python: >=3.12\\n\\n"\n    )\n''',
              ),
              (
                  '''    with pytest.warns(UserWarning, match="Duplicate name"):\n        with zipfile.ZipFile(rebuilt, "a") as archive:\n            archive.writestr("pmgs_reference/__init__.py", b"VERSION = 'duplicate'\\n")\n''',
                  '''    with (\n        pytest.warns(UserWarning, match="Duplicate name"),\n        zipfile.ZipFile(rebuilt, "a") as archive,\n    ):\n        archive.writestr("pmgs_reference/__init__.py", b"VERSION = 'duplicate'\\n")\n''',
              ),
              (
                  '''    result = module.verify_distribution_set(tmp_path, "0.4.0")\n''',
                  '''    (tmp_path / ".gitignore").write_text("*\\n", encoding="utf-8")\n    result = module.verify_distribution_set(tmp_path, "0.4.0")\n''',
              ),
              (
                  '''    assert set(result["sha256"]) == {wheel.name, sdist.name}\n\n    (tmp_path / "unexpected.txt").write_text("x", encoding="utf-8")\n''',
                  '''    assert set(result["sha256"]) == {wheel.name, sdist.name}\n\n    (tmp_path / ".gitignore").unlink()\n    (tmp_path / ".gitignore").mkdir()\n    with pytest.raises(RuntimeError, match="non-file uv build marker"):\n        module.verify_distribution_set(tmp_path, "0.4.0")\n    (tmp_path / ".gitignore").rmdir()\n\n    (tmp_path / "unexpected.txt").write_text("x", encoding="utf-8")\n''',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit("staged test normalization anchor not found")
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding="utf-8")

          verifier_path = Path("scripts/verify_distribution_set.py")
          verifier = verifier_path.read_text(encoding="utf-8")
          old_marker_boundary = '''    if symbolic_links:\n        raise RuntimeError(\n            f"symbolic link distribution entry: {', '.join(symbolic_links)}"\n        )\n    expected_names = {\n'''
          new_marker_boundary = '''    if symbolic_links:\n        raise RuntimeError(\n            f"symbolic link distribution entry: {', '.join(symbolic_links)}"\n        )\n    uv_marker = root / ".gitignore"\n    if uv_marker.exists() and not uv_marker.is_file():\n        raise RuntimeError("non-file uv build marker: .gitignore")\n    entries = [path for path in entries if path.name != ".gitignore"]\n    expected_names = {\n'''
          if old_marker_boundary not in verifier:
              raise SystemExit("distribution verifier marker anchor not found")
          verifier_path.write_text(
              verifier.replace(old_marker_boundary, new_marker_boundary, 1),
              encoding="utf-8",
          )

          release_path = Path(".github/workflows/release.yml")
          release = release_path.read_text(encoding="utf-8")
          release_replacements = (
              ("  build-distributions:\n", "  build:\n"),
              ("    needs: build-distributions\n", "    needs: build\n"),
              ("      - build-distributions\n", "      - build\n"),
          )
          for old, new in release_replacements:
              if old not in release:
                  raise SystemExit(f"release workflow compatibility anchor not found: {old!r}")
              release = release.replace(old, new)
          release_path.write_text(release, encoding="utf-8")

          contract_path = Path("tests/test_release_gate_contract.py")
          contract = contract_path.read_text(encoding="utf-8")
          if '"build-distributions"' not in contract:
              raise SystemExit("release gate test compatibility anchor not found")
          contract_path.write_text(
              contract.replace('"build-distributions"', '"build"'),
              encoding="utf-8",
          )

          runbook_path = Path("docs/release-runbook.md")
          runbook = runbook_path.read_text(encoding="utf-8")
          if "`build-distributions`" not in runbook:
              raise SystemExit("release runbook compatibility anchor not found")
          runbook_path.write_text(
              runbook.replace("`build-distributions`", "`build`"),
              encoding="utf-8",
          )

          project_contract_path = Path("tests/test_project_contracts.py")
          project_contract = project_contract_path.read_text(encoding="utf-8")
          old_artifact_assertion = '    assert raw.count("name: python-distributions") == 3\n'
          new_artifact_assertion = "\n".join(
              (
                  "    distribution_uploads = [",
                  "        step",
                  '        for step in jobs["build"]["steps"]',
                  '        if "upload-artifact@" in str(step.get("uses", ""))',
                  '        and step.get("with", {}).get("name") == "python-distributions"',
                  "    ]",
                  "    assert len(distribution_uploads) == 1",
                  '    for job_name in ("verify-distributions", "publish-pypi", "publish-github"):',
                  "        distribution_downloads = [",
                  "            step",
                  "            for step in jobs[job_name][\"steps\"]",
                  '            if "download-artifact@" in str(step.get("uses", ""))',
                  '            and step.get("with", {}).get("name") == "python-distributions"',
                  "        ]",
                  "        assert len(distribution_downloads) == 1",
                  "",
              )
          )
          if old_artifact_assertion not in project_contract:
              raise SystemExit("project artifact contract anchor not found")
          project_contract_path.write_text(
              project_contract.replace(
                  old_artifact_assertion,
                  new_artifact_assertion,
                  1,
              ),
              encoding="utf-8",
          )
          PY
      - name: Verify Python contracts and distributions
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff format scripts/verify_distribution_set.py tests/test_release_scripts.py tests/test_release_gate_contract.py tests/test_project_contracts.py
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_wheel_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py --dist-dir dist --source tests/fixtures/synthetic_pmgs
      - name: Verify Worker and WebMCP
        shell: bash
        run: |
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Commit verified implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-release-gates-sdist.yml
          git rm .github/workflows/inspect-release-gates-sdist.yml
          git rm -r .github/step1-chunks
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/release.yml docs/release-runbook.md docs/requirements-traceability.md docs/verification/2026-08-23-release-gates-sdist.md scripts/verify_distribution_set.py scripts/verify_sdist_install.py tests/test_project_contracts.py tests/test_release_gate_contract.py tests/test_release_scripts.py
          git commit -m "ci: gate releases on three-OS sdist verification"
          git push origin HEAD:ci/release-gates-sdist
