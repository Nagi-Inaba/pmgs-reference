name: trigger-fix-v050-review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'chore/fix-v050-review'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_MAIN: 9712ac2becf6b422344a0cbb0570bae52dcecf45
      EXPECTED_RELEASE_HEAD: fda7a585de681c0287d2b284af5d0899b2eb4bf4
    steps:
      - name: Check out helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
          package-manager-cache: false
      - name: Check out fixed release candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/apply-v050-candidate-docs.py "$RUNNER_TEMP/apply-v050-candidate-docs.py"
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          actual_release="$(git ls-remote origin refs/heads/release/v0.5.0 | awk '{print $1}')"
          test "$actual_main" = "$EXPECTED_MAIN"
          test "$actual_release" = "$EXPECTED_RELEASE_HEAD"
          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/release/v0.5.0:refs/remotes/origin/release/v0.5.0
          git checkout -B release-v050-review origin/release/v0.5.0
      - name: Apply candidate publication-state fixes
        shell: bash
        run: python "$RUNNER_TEMP/apply-v050-candidate-docs.py"
      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-groups
          uv run --frozen python scripts/verify_repository_boundary.py
          uv run --frozen ruff check .
          uv run --frozen ruff format tests/test_project_contracts.py
          uv run --frozen ruff format --check .
          uv run --frozen mypy src
          uv run --frozen pytest -q tests/test_project_contracts.py
          uv run --frozen pytest -q
          uv build --clear
          uv run --frozen python scripts/verify_distribution_set.py --dist-dir dist
          uv run --frozen python scripts/verify_release_tag.py --tag v0.5.0
          uv run --frozen python scripts/verify_wheel_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          uv run --frozen python scripts/verify_sdist_install.py \
            --dist-dir dist \
            --source tests/fixtures/synthetic_pmgs
          npm --prefix worker ci
          npm --prefix worker run verify
      - name: Push verified release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add PLAN.md README.md README.en.md \
            docs/current-status.md docs/local-agent-kit.md docs/local-agent-kit.en.md \
            docs/releases/v0.5.0.md docs/requirements-traceability.md \
            tests/test_project_contracts.py
          git commit -m "docs: keep v0.5.0 links pending until publication"
          git push \
            --force-with-lease=refs/heads/release/v0.5.0:$EXPECTED_RELEASE_HEAD \
            origin HEAD:refs/heads/release/v0.5.0
