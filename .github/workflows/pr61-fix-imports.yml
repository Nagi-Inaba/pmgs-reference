name: pr61-fix-imports

on:
  push:
    branches:
      - fix/fts5-schema-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/fts5-schema-contract
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.10.12"
          python-version: "3.12"
          enable-cache: true

      - name: Apply and commit import ordering
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run --frozen ruff check --fix src/pmgs_reference/store.py
          uv run --frozen ruff format src/pmgs_reference/store.py
          git rm .github/workflows/pr61-fix-imports.yml
          git config user.name "NAGI"
          git config user.email "221035391+Nagi-Inaba@users.noreply.github.com"
          git add src/pmgs_reference/store.py
          git commit -m "style: normalize FTS schema imports"
          git push origin HEAD:fix/fts5-schema-contract
